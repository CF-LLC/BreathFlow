<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const currentPath = window.location.pathname;
  
    if (currentPath.includes('/breathe/') && !currentPath.startsWith('/BreathFlow/')) {
      const correctedPath = currentPath.replace(/^\/[^/]+\//, '/BreathFlow/');
      window.location.href = correctedPath;
    } else {
      window.location.href = '/BreathFlow/';
    }
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a id="redirect-link" href="/">click here</a>.</p>
  
  <script>
    // Update the redirect link href
    document.getElementById('redirect-link').href = '/' + location.pathname.split('/')[1];
  </script>
</body>
</html>
