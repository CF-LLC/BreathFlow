name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create .nojekyll file
        run: touch out/.nojekyll

      - name: Copy 404.html to output directory
        run: cp public/404.html out/404.html

      - name: Create redirect directories
        run: |
          mkdir -p out/breathe/sleep
          mkdir -p out/breathe/focus
          mkdir -p out/breathe/digestive
          mkdir -p out/breathe/cardiac
          mkdir -p out/breathe/wimhof
          mkdir -p out/breathe/fire

      - name: Copy redirect files
        run: |
          cp public/breathe/sleep/index.html out/breathe/sleep/index.html
          cp public/breathe/focus/index.html out/breathe/focus/index.html
          cp public/breathe/digestive/index.html out/breathe/digestive/index.html
          cp public/breathe/cardiac/index.html out/breathe/cardiac/index.html
          cp public/breathe/wimhof/index.html out/breathe/wimhof/index.html
          cp public/breathe/fire/index.html out/breathe/fire/index.html
          cp public/redirect.html out/redirect.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
