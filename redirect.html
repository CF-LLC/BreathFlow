<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const currentPath = window.location.pathname;
  
    if (currentPath.includes('/breathe/') && !currentPath.startsWith('/BreathFlow/')) {
      const correctedPath = currentPath.replace(/^\/[^/]+\//, '/BreathFlow/');
      window.location.href = correctedPath;
    } else {
      window.location.href = '/BreathFlow/';
    }
    // Add a console log for debugging purposes
    console.log('Redirecting to /BreathFlow/');
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a href="/BreathFlow/">click here</a>.</p>
</body>
</html>
