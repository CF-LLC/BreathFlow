<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // Modified from https://github.com/rafgraph/spa-github-pages
    
    // This script takes the current URL and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new URL with only a query string and hash fragment
    
    // Get the repo name from the path (first segment after domain)
    var repoName = location.pathname.split('/')[1];
    
    // If URL is example.com/repo/page1/subpage, pathSegmentsToKeep = 1 means keep 'page1/subpage'
    var pathSegmentsToKeep = 1;
    
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/' + repoName + '/' +
      l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/') +
      '?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a id="redirect-link" href="/">click here</a>.</p>
  
  <script>
    // Update the redirect link href
    document.getElementById('redirect-link').href = '/' + location.pathname.split('/')[1];
  </script>
</body>
</html>
