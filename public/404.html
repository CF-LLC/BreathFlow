<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const repoName = location.pathname.split('/')[1];
    const pathSegmentsToKeep = 1;
    const l = window.location;
  
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/' + repoName + '/' +
      l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/') +
      (l.search ? '&' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a id="redirect-link" href="/">click here</a>.</p>
  
  <script>
    // Update the redirect link href
    document.getElementById('redirect-link').href = '/' + location.pathname.split('/')[1];
  </script>
</body>
</html>
